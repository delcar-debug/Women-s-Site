<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holmen Women's Wrestling — Record Board</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#6d1730">
<style>
:root{
  --maroon:#6d1730;
  --dark:#3f0b1a;
  --light:#f5f5f7;
  --ink:#19191d;
  --gold:#e8c37a;
  --silver:#d7dde3;
  --bronze:#d79a6a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;
}

#stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.slide-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:1;
  transition:opacity 1.3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#000 0%,var(--dark) 35%,var(--maroon) 65%,#000 100%);
}
.slide-layer.active{ opacity:1; z-index:2; }

.slide-inner{
  position:relative;
  z-index:2;
  width:min(1600px,94vw);
  max-height:88vh;
  margin:auto;
  text-align:center;
  padding:40px;
}

/* Logo watermark, persistent corner */
.tv-logo{
  position:fixed;
  top:28px;
  left:32px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:14px;
  opacity:.92;
  pointer-events:none;
}
.tv-logo img{ height:92px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.tv-logo-text{ display:flex; flex-direction:column; gap:2px; }
.tv-logo-title{
  font-weight:900;
  font-size:1.9rem;
  letter-spacing:-.02em;
  line-height:1.1;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.tv-logo-sub{
  font-weight:700;
  font-size:1.05rem;
  letter-spacing:-.01em;
  opacity:.85;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* Progress bar */
#tv-progress-wrap{
  position:fixed;
  left:0; right:0; bottom:0;
  height:6px;
  background:rgba(255,255,255,.14);
  z-index:60;
}
#tv-progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),#fff);
}
#tv-progress-bar.animate{ transition:width linear; }

/* ---- Slide type: title (section divider) ---- */
.tv-eyebrow{
  text-transform:uppercase;
  letter-spacing:.24em;
  font-size:clamp(.85rem,1.3vw,1.15rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 14px;
}
.tv-title-heading{
  font-size:clamp(3rem,7.5vw,7rem);
  font-weight:900;
  letter-spacing:-.03em;
  margin:0 0 20px;
  line-height:1.03;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}
.tv-title-sub{
  font-size:clamp(1.1rem,2.1vw,1.8rem);
  font-weight:600;
  max-width:900px;
  margin:0 auto;
  line-height:1.5;
  opacity:.96;
}

/* ---- Leaderboard (single category) ---- */
.tv-lb-eyebrow{
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:clamp(.8rem,1.2vw,1.05rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 6px;
}
.tv-lb-title{
  font-size:clamp(2rem,4.4vw,4rem);
  font-weight:900;
  letter-spacing:-.02em;
  margin:0 0 26px;
}
.tv-lb-list{
  display:grid;
  gap:10px;
  max-width:1000px;
  margin:0 auto;
  text-align:left;
}
.tv-lb-row{
  display:grid;
  grid-template-columns:64px minmax(0,1fr) auto auto;
  align-items:center;
  gap:18px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  padding:12px 22px;
}
.tv-lb-row.r1{ background:rgba(232,195,122,.16); border-color:rgba(232,195,122,.45); }
.tv-lb-row.r2{ background:rgba(215,221,227,.14); border-color:rgba(215,221,227,.4); }
.tv-lb-row.r3{ background:rgba(215,154,106,.14); border-color:rgba(215,154,106,.4); }
.tv-lb-rank{ font-size:clamp(1.3rem,2vw,1.8rem); font-weight:900; text-align:center; opacity:.85; }
.tv-lb-name{ font-size:clamp(1.1rem,1.9vw,1.6rem); font-weight:800; letter-spacing:-.01em; }
.tv-lb-years{ font-size:clamp(.8rem,1.1vw,1rem); font-weight:600; opacity:.75; text-align:right; white-space:nowrap; }
.tv-lb-value{ font-size:clamp(1.3rem,2.2vw,1.9rem); font-weight:900; color:var(--gold); text-align:right; min-width:70px; }

/* ---- Leaderboard pair (two categories side by side) ---- */
.tv-lb-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:44px;
  width:100%;
  align-items:start;
  margin-top:18px;
}
.tv-lb-pair .tv-lb-list{ margin:0; max-width:none; }
.tv-lb-pair .tv-lb-row{ padding:10px 16px; grid-template-columns:48px minmax(0,1fr) auto auto; gap:10px; }

/* ---- Fastest pins slide ---- */
.tv-pins-list{
  display:grid;
  gap:8px;
  max-width:920px;
  margin:0 auto;
  text-align:left;
}
.tv-pins-row{
  display:grid;
  grid-template-columns:56px minmax(0,1fr) auto auto;
  align-items:center;
  gap:16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:9px 20px;
}
.tv-pins-row.r1{ background:rgba(232,195,122,.16); border-color:rgba(232,195,122,.45); }
.tv-pins-rank{ font-size:1.2rem; font-weight:900; text-align:center; opacity:.85; }
.tv-pins-name{ font-size:clamp(1rem,1.6vw,1.35rem); font-weight:800; }
.tv-pins-year{ font-size:.85rem; font-weight:600; opacity:.7; text-align:right; }
.tv-pins-time{ font-size:clamp(1.15rem,1.9vw,1.6rem); font-weight:900; color:var(--gold); text-align:right; min-width:70px; }

/* ---- Pillar winners slide ---- */
.tv-pillar-groups{
  display:grid;
  gap:26px;
}
.tv-pillar-season{
  font-size:clamp(1.05rem,1.8vw,1.5rem);
  font-weight:900;
  margin:0 0 12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--gold);
}
.tv-pillar-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:10px;
  max-width:1400px;
  margin:0 auto;
}
.tv-pillar-entry{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:10px 15px;
  text-align:left;
}
.tv-pillar-entry .name{ font-size:clamp(.88rem,1.35vw,1.1rem); font-weight:800; margin:0 0 2px; }
.tv-pillar-entry .pillar{ font-size:clamp(.7rem,1.05vw,.88rem); font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.05em; margin:0; }

/* Fullscreen helper button */
#tv-fs-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:70;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-weight:800;
  font-size:.85rem;
  border-radius:999px;
  padding:10px 18px;
  cursor:pointer;
  opacity:.55;
}
#tv-fs-btn:hover{ opacity:1; }

/* QR code, persistent corner */
#tv-qr-box{
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  opacity:.92;
}
#tv-qr-box img{
  width:100px;
  height:100px;
  border-radius:10px;
  background:#fff;
  padding:6px;
  display:block;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
#tv-qr-box span{
  font-size:.72rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

@media(max-width:1100px){
  .tv-lb-pair{ grid-template-columns:1fr; gap:20px; }
  .tv-pillar-grid{ grid-template-columns:1fr 1fr; }
}
@media(max-width:700px){
  .tv-logo img{ height:56px; }
  .tv-logo-title{ font-size:1.15rem; }
  .tv-logo-sub{ font-size:.72rem; }
  .tv-pillar-grid{ grid-template-columns:1fr; }
  #tv-qr-box img{ width:70px; height:70px; }
  #tv-qr-box span{ font-size:.6rem; }
}
</style>
</head>
<body>

<div class="tv-logo"><img src="assets/images/logo.png" alt=""><div class="tv-logo-text"><span class="tv-logo-title">Record Board</span><span class="tv-logo-sub">Holmen Women's Wrestling</span></div></div>

  const catA = careerCats[i], catB = careerCats[i+1];
  if (catB){
    SLIDES.push({ type:'lb-pair', duration:9000, group:'Career Leaders', catA, listA:CAREER[catA], catB, listB:CAREER[catB] });

    SLIDES.push({ type:'leaderboard', duration:8000, group:'Career Leaders', cat:catA, list:CAREER[catA] });
  }
}

// Single-Season Leaders

for (let i=0; i<singleCats.length; i+=2){

// ---- Rendering ----
function lbRowsHtml(list){
  return list.map(row => `
    <div class="tv-lb-row ${rankClass(row.r)}">
      <div class="tv-lb-rank">${rankLabel(row.r)}</div>
      <div class="tv-lb-name">${row.name}</div>
      <div class="tv-lb-years">${row.years}</div>
      <div class="tv-lb-value">${row.v}</div>
    </div>`).join('');
}

function renderSlide(slide){
  switch(slide.type){
    case 'title':
      return `<div class="slide-inner">
        <div class="tv-eyebrow">${slide.eyebrow}</div>
        <h1 class="tv-title-heading">${slide.title}</h1>
        <p class="tv-title-sub">${slide.sub}</p>
      </div>`;

    case 'leaderboard':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.group}</div>
        <h2 class="tv-lb-title">${slide.cat}</h2>
        <div class="tv-lb-list">${lbRowsHtml(slide.list)}</div>
      </div>`;

    case 'lb-pair':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.group}</div>
        <div class="tv-lb-pair">
          <div>
            <h2 class="tv-lb-title">${slide.catA}</h2>
            <div class="tv-lb-list">${lbRowsHtml(slide.listA)}</div>
          </div>
          <div>
            <h2 class="tv-lb-title">${slide.catB}</h2>
            <div class="tv-lb-list">${lbRowsHtml(slide.listB)}</div>
          </div>
        </div>
      </div>`;

    case 'pins':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">Record Board</div>
        <h2 class="tv-lb-title">${slide.title}</h2>
        <div class="tv-pins-list">
          ${slide.list.map(row => `
            <div class="tv-pins-row ${row.r===1?'r1':''}">
              <div class="tv-pins-rank">${row.r}</div>
              <div class="tv-pins-name">${row.name}</div>
              <div class="tv-pins-year">${row.year}</div>
              <div class="tv-pins-time">${row.t}</div>
            </div>`).join('')}
        </div>
      </div>`;

    case 'pillar-winners':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">Record Board</div>
        <h2 class="tv-lb-title">Pillar Award Winners</h2>
        <div class="tv-pillar-groups">
          ${slide.groups.map(g => `
            <div class="tv-pillar-group">
              <div class="tv-pillar-season">${g.season}</div>
              <div class="tv-pillar-grid">
                ${g.entries.map(e => `
                  <div class="tv-pillar-entry">
                    <p class="name">${e.name}</p>
                    <p class="pillar">${e.pillar}</p>
                  </div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;

    default:
      return '';
  }
}

let current = 0;
let showingA = true;

function runProgressBar(duration){
  const bar = document.getElementById('tv-progress-bar');
  bar.classList.remove('animate');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.classList.add('animate');
  bar.style.transition = `width ${duration}ms linear`;
  bar.style.width = '100%';
}

function showSlide(index){
  const slide = SLIDES[index];
  const layerA = document.getElementById('layerA');
  const layerB = document.getElementById('layerB');
  const incoming = showingA ? layerB : layerA;
  const outgoing = showingA ? layerA : layerB;

  incoming.innerHTML = renderSlide(slide);
  incoming.classList.add('active');
  outgoing.classList.remove('active');
  showingA = !showingA;

  runProgressBar(slide.duration);

  clearTimeout(window.__tvTimer);
  window.__tvTimer = setTimeout(() => {
    current = (current + 1) % SLIDES.length;
    showSlide(current);
  }, slide.duration);
}

document.getElementById('tv-fs-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

function goToSlide(index){
  current = (index + SLIDES.length) % SLIDES.length;
  showSlide(current);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    document.getElementById('tv-fs-btn').click();
  } else if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    goToSlide(current + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goToSlide(current - 1);
  }
});

const qrImg = document.getElementById('tv-qr-img');
if (qrImg) {
  const statsUrl = location.origin + '/stats-records.html';
  qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=' + encodeURIComponent(statsUrl);
}

showSlide(current);
</script>
</body>
</html>
