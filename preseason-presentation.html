<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holmen Women's Wrestling — Preseason Meeting</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#6d1730">
<style>
:root{
  --maroon:#6d1730;
  --dark:#3f0b1a;
  --light:#f5f5f7;
  --ink:#19191d;
  --gold:#e8c37a;
  --silver:#d7dde3;
  --bronze:#d79a6a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;
}

#stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.slide-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:1;
  transition:opacity 1.3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#000 0%,var(--dark) 35%,var(--maroon) 65%,#000 100%);
  overflow-y:auto;
}
.slide-layer.active{ opacity:1; z-index:2; }

.slide-inner{
  position:relative;
  z-index:2;
  width:min(1900px,97vw);
  max-height:95vh;
  margin:auto;
  text-align:center;
  padding:24px;
}

/* Logo watermark, persistent corner */
.tv-logo{
  position:fixed;
  top:28px;
  left:32px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:14px;
  opacity:.92;
  pointer-events:none;
}
.tv-logo img{ height:104px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.tv-logo-text{ display:flex; flex-direction:column; gap:2px; }
.tv-logo-title{
  font-weight:900;
  font-size:2.3rem;
  letter-spacing:-.02em;
  line-height:1.1;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.tv-logo-sub{
  font-weight:700;
  font-size:1.7rem;
  letter-spacing:-.01em;
  opacity:.85;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* Progress bar */
#tv-progress-wrap{
  position:fixed;
  left:0; right:0; bottom:0;
  height:6px;
  background:rgba(255,255,255,.14);
  z-index:60;
}
#tv-progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),#fff);
}
#tv-progress-bar.animate{ transition:width linear; }

/* ---- Slide type: title ---- */
.tv-eyebrow{
  text-transform:uppercase;
  letter-spacing:.24em;
  font-size:clamp(1.6rem,3vw,2.8rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 18px;
}
.tv-title-heading{
  font-size:clamp(3rem,7.5vw,7rem);
  font-weight:900;
  letter-spacing:-.03em;
  margin:0 0 20px;
  line-height:1.05;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}
.tv-title-sub{
  font-size:clamp(1.3rem,2.4vw,2rem);
  font-weight:600;
  max-width:1050px;
  margin:0 auto;
  line-height:1.5;
  opacity:.96;
}

/* ---- Section eyebrow + title above lists ---- */
.tv-lb-eyebrow{
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:clamp(1.2rem,2vw,1.7rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 10px;
}
.tv-lb-title{
  font-size:clamp(2.2rem,4.6vw,4rem);
  font-weight:900;
  letter-spacing:-.02em;
  margin:0 0 26px;
}

/* ---- Slide type: quote / mission ---- */
.tv-statement{
  font-size:clamp(1.6rem,3.2vw,3rem);
  font-weight:800;
  line-height:1.4;
  max-width:1400px;
  margin:0 auto;
}
.tv-statement strong{ color:var(--gold); }

/* ---- Slide type: overview (page cards grid) ---- */
.tv-overview-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  max-width:1700px;
  margin:0 auto;
}
.tv-overview-card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  padding:20px 22px;
  text-align:left;
}
.tv-overview-card .icon{ font-size:1.8rem; margin-bottom:8px; }
.tv-overview-card .name{ font-size:clamp(1.1rem,1.6vw,1.4rem); font-weight:900; margin:0 0 6px; }
.tv-overview-card .desc{ font-size:clamp(.85rem,1.15vw,1.05rem); line-height:1.42; opacity:.88; margin:0; }

/* ---- Slide type: task list ---- */
.tv-task-list{
  display:grid;
  gap:14px;
  max-width:1350px;
  margin:0 auto;
  text-align:left;
}
.tv-task-row{
  display:flex;
  align-items:flex-start;
  gap:20px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  padding:18px 26px;
}
.tv-task-num{
  flex:0 0 auto;
  width:46px; height:46px;
  border-radius:50%;
  background:rgba(232,195,122,.18);
  border:1px solid rgba(232,195,122,.5);
  color:var(--gold);
  font-weight:900;
  font-size:1.3rem;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tv-task-body .name{ font-size:clamp(1.15rem,1.9vw,1.6rem); font-weight:900; margin:0 0 4px; }
.tv-task-body .desc{ font-size:clamp(.92rem,1.3vw,1.15rem); opacity:.88; line-height:1.42; margin:0; }
.tv-task-body .code{ display:inline-block; margin-top:8px; font-weight:900; letter-spacing:.06em; color:var(--gold); background:rgba(232,195,122,.14); border:1px solid rgba(232,195,122,.4); border-radius:999px; padding:6px 16px; font-size:1rem; }

/* ---- Slide type: info-bullets ---- */
.tv-info-list{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  gap:14px;
  text-align:left;
  max-width:1250px;
  margin-inline:auto;
}
.tv-info-list li{
  font-size:clamp(1rem,1.7vw,1.45rem);
  line-height:1.5;
  font-weight:650;
  padding-left:38px;
  position:relative;
}
.tv-info-list li::before{
  content:"\2022";
  position:absolute;
  left:6px;
  top:-.06em;
  font-size:1.4em;
  color:var(--gold);
}

/* ---- Slide type: cta ---- */
.tv-cta-title{
  font-size:clamp(2.2rem,4.6vw,4rem);
  font-weight:900;
  margin:0 0 16px;
  letter-spacing:-.02em;
}
.tv-cta-sub{
  font-size:clamp(1.15rem,2vw,1.6rem);
  max-width:1000px;
  margin:0 auto 22px;
  line-height:1.5;
  opacity:.95;
}
.tv-cta-contact{
  display:inline-flex;
  flex-direction:column;
  gap:6px;
  font-size:clamp(1.1rem,1.8vw,1.4rem);
  font-weight:800;
  color:var(--gold);
}

/* Fullscreen helper button */
#tv-fs-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:70;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-weight:800;
  font-size:1.05rem;
  border-radius:999px;
  padding:10px 18px;
  cursor:pointer;
  opacity:.55;
}
#tv-fs-btn:hover{ opacity:1; }
body.is-fullscreen #tv-fs-btn{ display:none; }

/* QR code, persistent corner */
#tv-qr-box{
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  opacity:.92;
}
#tv-qr-box img{
  width:100px;
  height:100px;
  border-radius:10px;
  background:#fff;
  padding:6px;
  display:block;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
#tv-qr-box span{
  font-size:.9rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

@media(max-width:1100px){
  .tv-overview-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media(max-width:700px){
  .tv-logo img{ height:56px; }
  .tv-logo-title{ font-size:1.15rem; }
  .tv-logo-sub{ font-size:.9rem; }
  .tv-overview-grid{ grid-template-columns:1fr; }
  #tv-qr-box img{ width:70px; height:70px; }
  #tv-qr-box span{ font-size:.6rem; }
}
</style>
</head>
<body>

<div class="tv-logo"><img src="assets/images/logo.png" alt=""><div class="tv-logo-text"><span class="tv-logo-title">Preseason Meeting</span><span class="tv-logo-sub">Holmen Women's Wrestling</span></div></div>

<div id="stage">
  <div class="slide-layer active" id="layerA"></div>
  <div class="slide-layer" id="layerB"></div>
</div>

<div id="tv-progress-wrap"><div id="tv-progress-bar"></div></div>
<button id="tv-fs-btn" type="button">⛶ Fullscreen</button>
<div id="tv-qr-box"><img id="tv-qr-img" alt="QR code linking to the Team Hub handbook"><span>Full Handbook</span></div>

<script>
// ---- Data ----

const OVERVIEW_PAGES = [
  { icon:'🏠', name:'Home', desc:'Team news, coaches, and quick links to everything else on the site.' },
  { icon:'📋', name:'Team Hub', desc:'The full handbook, weekly updates, and this preseason checklist — login required.' },
  { icon:'🤼', name:'Results', desc:'Every match and tournament result, season by season, searchable by wrestler.' },
  { icon:'🏆', name:'Stats & Records', desc:'Career and single-season leaderboards, awards, and postseason herstory.' },
  { icon:'📸', name:'Media Gallery', desc:'Team photos, Season Finishers, and senior posters — all downloadable.' },
  { icon:'📅', name:'Calendar', desc:'Every practice, meet, and team event in one place — add it to your own calendar.' },
  { icon:'📰', name:'Recaps', desc:'The latest news and recap posts from our meets and tournaments.' },
  { icon:'🕒', name:'Timeline', desc:'Team history and Awards & Honors going back to the start of the program.' },
  { icon:'❓', name:'FAQ', desc:'Answers to the questions we hear most from new wrestlers and families.' }
];

const TASKS = [
  { name:'Join SportsYou', desc:'Our way of sending group messages and messaging individual wrestlers. Join the Holmen Women’s Wrestling group.', code:'Code: P366F585' },
  { name:'Create a USA Bracketing Account', desc:'Wrestlers need an account so they can be added to our roster for meets. Anyone can create one to find brackets and results.' },
  { name:'Register Through the School District', desc:'Complete the required school district athletics registration before the season begins.' },
  { name:'Add the Team Calendar to Your Device', desc:'Add the Holmen Women’s Wrestling calendar to your phone, tablet, or computer so you never miss a practice or meet.' },
  { name:'Complete SafeSport Training (Seniors)', desc:'Required to become a USA Wrestling member if you’re turning 18 before August 31, 2027. Membership includes secondary insurance, which can cover hundreds of dollars if a wrestler is injured.' }
];

const WRESTLER_PRESEASON = [
  'Log in to the website and complete the Parent/Wrestler Info & To-Do page.',
  'Have all paperwork on file in the office (Physical/Alt Year Card, Athletic Code, Athletic Fee).',
  'Get physically ready — conditioning, lifting, a fall sport, and/or open mat.',
  'Get wrestling shoes and headgear. Extras are in the wrestling room storage closet.',
  'Bookmark the website to your phone’s home screen — it’s our one-stop shop for everything.'
];

const PARENT_STANDARDS = [
  'Log in to the website and complete the Parent/Wrestler Info & To-Do page.',
  'Follow our mission and pillars — cheer for the whole team, get to know other parents, connect positively with coaches.',
  'Help hold your wrestler accountable for attitude, mindset, attendance, and effort.',
  'Check email at least once every 24 hours and keep SportsYou notifications turned on.',
  'All communication with coaches should go through Carl’s email or SportsYou.'
];

const LETTERING = [
  'Finish in good standing with the team — no code violations, good attendance, within our mission.',
  'Be a varsity wrestler for at least three varsity-only events, or',
  'Be in the lineup for regionals, or',
  'Be a senior with two full seasons on the team and no code/grade violations, or',
  'Be a manager in at least their second year, or any senior manager.',
  'All letters are subject to coaches’ discretion.'
];

// ---- Build slide list ----
const SLIDES = [
  { type:'title', duration:9000, eyebrow:'Preseason Meeting', title:'Welcome to the Season', sub:'A quick tour of our website, your preseason to-dos, and the handbook basics every wrestler and parent should know.' },

  { type:'mission', duration:9000, text:'Everything we do is <strong>for each other</strong>, for women’s wrestling, and for women’s sports everywhere. On the mat, we fight for our teammates. Off the mat, we grow the sport for the next generation of girls — <strong>For Her.</strong>' },

  { type:'overview', duration:11000, eyebrow:'Website Tour', title:'What’s on the Website', pages:OVERVIEW_PAGES },

  { type:'tasks', duration:11000, eyebrow:'Before the Season Starts', title:'Preseason Checklist', tasks:TASKS },

  { type:'info-bullets', duration:9500, eyebrow:'Handbook — Wrestler Standards', title:'Preseason, Wrestlers', items:WRESTLER_PRESEASON },

  { type:'info-bullets', duration:9500, eyebrow:'Handbook — Parent Standards', title:'Preseason, Parents', items:PARENT_STANDARDS },

  { type:'info-bullets', duration:9500, eyebrow:'Handbook — Lettering Criteria', title:'How to Earn a Letter', items:LETTERING },

  { type:'cta', duration:10000,
    title:'Questions?',
    sub:'The full handbook — communication policy, wrestle-off policy, and everything else — is always on the Team Hub.',
    contact:['Coach Carl DeLuca','delcar@holmen.k12.wi.us','715-204-7433'] }
];

// ---- Rendering ----
function renderSlide(slide){
  switch(slide.type){
    case 'title':
      return `<div class="slide-inner">
        <div class="tv-eyebrow">${slide.eyebrow}</div>
        <h1 class="tv-title-heading">${slide.title}</h1>
        <p class="tv-title-sub">${slide.sub}</p>
      </div>`;

    case 'mission':
      return `<div class="slide-inner"><p class="tv-statement">${slide.text}</p></div>`;

    case 'overview':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.eyebrow}</div>
        <h2 class="tv-lb-title">${slide.title}</h2>
        <div class="tv-overview-grid">
          ${slide.pages.map(p => `
            <div class="tv-overview-card">
              <div class="icon">${p.icon}</div>
              <p class="name">${p.name}</p>
              <p class="desc">${p.desc}</p>
            </div>`).join('')}
        </div>
      </div>`;

    case 'tasks':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.eyebrow}</div>
        <h2 class="tv-lb-title">${slide.title}</h2>
        <div class="tv-task-list">
          ${slide.tasks.map((t,i) => `
            <div class="tv-task-row">
              <div class="tv-task-num">${i+1}</div>
              <div class="tv-task-body">
                <p class="name">${t.name}</p>
                <p class="desc">${t.desc}</p>
                ${t.code ? `<span class="code">${t.code}</span>` : ''}
              </div>
            </div>`).join('')}
        </div>
      </div>`;

    case 'info-bullets':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.eyebrow}</div>
        <h2 class="tv-lb-title">${slide.title}</h2>
        <ul class="tv-info-list">${slide.items.map(i => `<li>${i}</li>`).join('')}</ul>
      </div>`;

    case 'cta':
      return `<div class="slide-inner">
        <h2 class="tv-cta-title">${slide.title}</h2>
        <p class="tv-cta-sub">${slide.sub}</p>
        <div class="tv-cta-contact">${slide.contact.map(c => `<span>${c}</span>`).join('')}</div>
      </div>`;

    default:
      return '';
  }
}

let current = 0;
let showingA = true;

function runProgressBar(duration){
  const bar = document.getElementById('tv-progress-bar');
  bar.classList.remove('animate');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.classList.add('animate');
  bar.style.transition = `width ${duration}ms linear`;
  bar.style.width = '100%';
}

function showSlide(index){
  const slide = SLIDES[index];
  const layerA = document.getElementById('layerA');
  const layerB = document.getElementById('layerB');
  const incoming = showingA ? layerB : layerA;
  const outgoing = showingA ? layerA : layerB;

  incoming.innerHTML = renderSlide(slide);
  incoming.scrollTop = 0;
  incoming.classList.add('active');
  outgoing.classList.remove('active');
  showingA = !showingA;

  runProgressBar(slide.duration);

  clearTimeout(window.__tvTimer);
  window.__tvTimer = setTimeout(() => {
    current = (current + 1) % SLIDES.length;
    showSlide(current);
  }, slide.duration);
}

document.getElementById('tv-fs-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
});

function goToSlide(index){
  clearTimeout(window.__tvTimer);
  current = (index + SLIDES.length) % SLIDES.length;
  showSlide(current);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    document.getElementById('tv-fs-btn').click();
  } else if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    goToSlide(current + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goToSlide(current - 1);
  }
});

const qrImg = document.getElementById('tv-qr-img');
if (qrImg) {
  const handbookUrl = location.origin + '/team-hub.html';
  qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=' + encodeURIComponent(handbookUrl);
}

showSlide(current);
</script>
</body>
</html>
