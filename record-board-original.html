<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Fire TV / smart TV browsers report a small (~960px) viewport; force a 1920px layout so the TV matches the desktop design */
if(/AFT|Silk|SmartTV|Tizen|Web0S|BRAVIA|Roku/i.test(navigator.userAgent)&&!/Mobile/i.test(navigator.userAgent)){var m=document.querySelector('meta[name=viewport]');if(m)m.setAttribute('content','width=1920, initial-scale='+(Math.min(screen.width||1920,1920)/1920));}</script>
<title>Holmen Women's Wrestling — Record Board</title>
<!-- Combined presentation: career/season records, fastest pins, pillar awards, perfect practice club, and postseason herstory (state qualifiers, regional/sectional champions, Fargo qualifiers, team accomplishments). -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#6d1730">
<style>
:root{
  --maroon:#6d1730;
  --dark:#3f0b1a;
  --light:#f5f5f7;
  --ink:#19191d;
  --gold:#e8c37a;
  --silver:#d7dde3;
  --bronze:#d79a6a;
}
*{box-sizing:border-box}
html,body,*{ cursor:none !important; } /* TV display: hide the mouse pointer */
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;
}

#stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.slide-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:1;
  transition:opacity 1.3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#000 0%,var(--dark) 35%,var(--maroon) 65%,#000 100%);
}
.slide-layer.active{ opacity:1; z-index:2; }

.slide-inner{
  position:relative;
  z-index:2;
  width:min(1900px,97vw);
  max-height:95vh;
  margin:auto;
  text-align:center;
  padding:24px;
}

/* Logo watermark, persistent corner */
.tv-logo{
  position:fixed;
  top:28px;
  left:32px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:14px;
  opacity:.92;
  pointer-events:none;
}
.tv-logo img{ height:104px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.tv-logo-text{ display:flex; flex-direction:column; gap:2px; }
.tv-logo-title{
  font-weight:900;
  font-size:2.3rem;
  letter-spacing:-.02em;
  line-height:1.1;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.tv-logo-sub{
  font-weight:700;
  font-size:1.7rem;
  letter-spacing:-.01em;
  opacity:.85;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* Progress bar */
#tv-progress-wrap{
  position:fixed;
  left:0; right:0; bottom:0;
  height:6px;
  background:rgba(255,255,255,.14);
  z-index:60;
}
#tv-progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),#fff);
}
#tv-progress-bar.animate{ transition:width linear; }


/* ---- Slide type: fun (why girls stay in wrestling) ---- */
.tv-fun{ position:relative; }
.tv-fun .tv-eyebrow{ margin-bottom:10px; }
.tv-fun-lead{ font-size:clamp(1.6rem,3vw,2.8rem); font-weight:700; margin:0 0 6px; opacity:.95; }
.tv-fun-big{
  font-size:clamp(3.4rem,9vw,9.5rem); font-weight:900; letter-spacing:-.04em; line-height:.9; margin:0;
  color:var(--gold); text-transform:uppercase; transform:rotate(-3deg);
  text-shadow:0 8px 0 rgba(0,0,0,.35), 0 0 60px rgba(255,255,255,.12);
  animation:funBounce 2.6s ease-in-out infinite;
}
.tv-fun-sub{ font-size:clamp(1.3rem,2.4vw,2.2rem); font-weight:600; margin:28px auto 0; max-width:1300px; opacity:.9; }
.tv-fun-big2{ font-size:clamp(2.2rem,5.6vw,5.6rem); font-weight:900; letter-spacing:-.03em; line-height:1; margin:18px 0 0; color:#fff; text-transform:uppercase; text-shadow:0 6px 0 rgba(0,0,0,.35); }
.tv-fun-cta{ display:inline-block; margin:26px auto 0; padding:14px 34px; border:4px solid var(--gold); border-radius:999px; background:rgba(0,0,0,.35); font-size:clamp(1.4rem,2.6vw,2.4rem); font-weight:800; color:#fff; }
.tv-fun-cta b{ color:var(--gold); text-transform:uppercase; letter-spacing:.06em; }
.tv-fun-body{ display:flex; align-items:center; gap:3vw; position:relative; z-index:2; }
.tv-fun-photo{ flex:0 0 32%; }
.tv-fun-photo img{ width:100%; max-height:80vh; object-fit:cover; display:block; border:8px solid var(--gold); border-radius:18px; box-shadow:0 14px 40px rgba(0,0,0,.55); transform:rotate(-2.5deg); }
.tv-fun-text{ flex:1; min-width:0; }
@media(max-width:900px){ .tv-fun-body{ flex-direction:column; } .tv-fun-photo{ flex:none; width:70%; } }
.tv-fun-dot{ position:absolute; border-radius:50%; opacity:.9; animation:funFloat 6s ease-in-out infinite; }
@keyframes funBounce{ 0%,100%{ transform:rotate(-3deg) scale(1);} 50%{ transform:rotate(-3deg) scale(1.04);} }
@keyframes funFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-22px);} }

/* ---- Slide type: title (section divider) ---- */
.tv-eyebrow{
  text-transform:uppercase;
  letter-spacing:.24em;
  font-size:clamp(2rem,3.6vw,3.4rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 18px;
}
.tv-title-heading{
  font-size:clamp(3.6rem,9vw,8.5rem);
  font-weight:900;
  letter-spacing:-.03em;
  margin:0 0 20px;
  line-height:1.03;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}
.tv-title-sub{
  font-size:clamp(1.4rem,2.7vw,2.3rem);
  font-weight:600;
  max-width:1000px;
  margin:0 auto;
  line-height:1.5;
  opacity:.96;
}

/* ---- Leaderboard (single category) ---- */
.tv-lb-eyebrow{
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:clamp(1.1rem,1.8vw,1.5rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 8px;
}
.tv-lb-title{
  font-size:clamp(2.1rem,4.4vw,4rem);
  font-weight:900;
  letter-spacing:-.02em;
  margin:0 0 20px;
}
.tv-lb-list{
  display:grid;
  gap:14px;
  max-width:1200px;
  margin:0 auto;
  text-align:left;
}
.tv-lb-row{
  display:grid;
  grid-template-columns:84px minmax(0,1fr) auto auto;
  align-items:center;
  gap:22px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:16px;
  padding:16px 28px;
}
.tv-lb-row.r1{ background:rgba(232,195,122,.16); border-color:rgba(232,195,122,.45); }
.tv-lb-row.r2{ background:rgba(215,221,227,.14); border-color:rgba(215,221,227,.4); }
.tv-lb-row.r3{ background:rgba(215,154,106,.14); border-color:rgba(215,154,106,.4); }
.tv-lb-rank{ font-size:clamp(1.7rem,2.7vw,2.4rem); font-weight:900; text-align:center; opacity:.85; }
.tv-lb-name{ font-size:clamp(1.5rem,2.5vw,2.2rem); font-weight:800; letter-spacing:-.01em; }
.tv-lb-years{ font-size:clamp(1rem,1.5vw,1.35rem); font-weight:600; opacity:.75; text-align:right; white-space:nowrap; }
.tv-lb-value{ font-size:clamp(1.7rem,2.9vw,2.6rem); font-weight:900; color:var(--gold); text-align:right; min-width:90px; }

/* ---- Leaderboard pair (two categories side by side) ---- */
.tv-lb-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:56px;
  width:100%;
  align-items:start;
  margin-top:22px;
}
.tv-lb-pair .tv-lb-list{ margin:0; max-width:none; gap:8px; }
.tv-lb-pair .tv-lb-row{ padding:8px 14px; grid-template-columns:52px minmax(0,1fr) auto auto; gap:10px; }
.tv-lb-pair .tv-lb-rank{ font-size:clamp(1.2rem,1.9vw,1.7rem); }
.tv-lb-pair .tv-lb-name{ font-size:clamp(1.05rem,1.7vw,1.55rem); }
.tv-lb-pair .tv-lb-years{ font-size:clamp(.75rem,1.1vw,.95rem); }
.tv-lb-pair .tv-lb-value{ font-size:clamp(1.2rem,2vw,1.8rem); }

/* ---- Leaderboard grid (all categories for a group on one slide) ---- */
.tv-lb-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px 24px;
  width:100%;
  align-items:start;
  margin-top:14px;
}
.tv-lb-grid .tv-lb-title{ font-size:clamp(1.3rem,2.2vw,1.8rem); margin:0 0 10px; }
.tv-lb-grid .tv-lb-list{ margin:0; max-width:none; gap:7px; }
.tv-lb-grid .tv-lb-row{ padding:7px 11px; grid-template-columns:34px minmax(0,1fr) auto; grid-template-areas:'rank name value' 'rank years value'; column-gap:8px; row-gap:0; border-radius:10px; }
.tv-lb-grid .tv-lb-rank{ grid-area:rank; }
.tv-lb-grid .tv-lb-name{ grid-area:name; line-height:1.15; }
.tv-lb-grid .tv-lb-years{ grid-area:years; text-align:left; line-height:1.15; }
.tv-lb-grid .tv-lb-value{ grid-area:value; }
.tv-lb-grid .tv-lb-rank{ font-size:clamp(1rem,1.55vw,1.3rem); }
.tv-lb-grid .tv-lb-name{ font-size:clamp(.95rem,1.45vw,1.3rem); }
.tv-lb-grid .tv-lb-years{ font-size:clamp(.66rem,.95vw,.82rem); }
.tv-lb-grid .tv-lb-value{ font-size:clamp(1.02rem,1.6vw,1.35rem); min-width:0; }

/* ---- Fastest pins slide ---- */
.tv-pins-list{
  column-count:2;
  column-gap:20px;
  max-width:1500px;
  margin:0 auto;
  text-align:left;
}
.tv-pins-row{
  display:grid;
  grid-template-columns:52px minmax(0,1fr) auto auto;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:9px 16px;
  margin-bottom:10px;
  break-inside:avoid;
}
.tv-pins-row.r1{ background:rgba(232,195,122,.16); border-color:rgba(232,195,122,.45); }
.tv-pins-rank{ font-size:1.2rem; font-weight:900; text-align:center; opacity:.85; }
.tv-pins-name{ font-size:clamp(1rem,1.5vw,1.3rem); font-weight:800; }
.tv-pins-year{ font-size:.9rem; font-weight:600; opacity:.7; text-align:right; }
.tv-pins-time{ font-size:clamp(1.15rem,1.7vw,1.5rem); font-weight:900; color:var(--gold); text-align:right; min-width:70px; }

/* ---- Pillar winners slide ---- */
.tv-pillar-groups{
  display:grid;
  gap:30px;
}
.tv-pillar-season{
  font-size:clamp(1.35rem,2.3vw,1.95rem);
  font-weight:900;
  margin:0 0 14px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--gold);
}
.tv-pillar-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:14px;
  max-width:1600px;
  margin:0 auto;
}
.tv-pillar-entry{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;
  padding:14px 18px;
  text-align:left;
}
.tv-pillar-entry .name{ font-size:clamp(1.15rem,1.8vw,1.5rem); font-weight:800; margin:0 0 4px; }
.tv-pillar-entry .pillar{ font-size:clamp(.92rem,1.35vw,1.15rem); font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.05em; margin:0; }

/* ---- Perfect Practice Club slide ---- */
.tv-club-chips{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}
.tv-club-chip{
  font-size:clamp(1rem,1.6vw,1.35rem);
  font-weight:800;
  background:rgba(232,195,122,.14);
  border:1px solid rgba(232,195,122,.4);
  border-radius:999px;
  padding:10px 22px;
  color:#fff;
}
.tv-rb-note{ margin:26px 0 0; font-size:clamp(1.05rem,1.5vw,1.35rem); font-weight:600; opacity:.72; }

/* ---- Qualifiers / Champions list (from State Board) ---- */
.tv-qual-list{
  column-count:2;
  column-gap:24px;
  max-width:1700px;
  margin:0 auto;
  text-align:left;
}
.tv-qual-row{
  display:grid;
  grid-template-columns:78px minmax(0,1fr) 78px auto;
  align-items:center;
  gap:12px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:9px 16px;
  margin-bottom:10px;
  break-inside:avoid;
}
.tv-qual-row.champ{ background:rgba(232,195,122,.13); border-color:rgba(232,195,122,.4); grid-template-columns:78px minmax(0,1fr) 78px; }
.tv-qual-year{ font-size:clamp(1rem,1.5vw,1.3rem); font-weight:900; opacity:.8; }
.tv-qual-name{ font-size:clamp(1.05rem,1.55vw,1.35rem); font-weight:800; letter-spacing:-.01em; }
.tv-qual-weight{ font-size:clamp(.85rem,1.2vw,1.05rem); font-weight:700; opacity:.75; text-align:center; }
.tv-qual-result{ font-size:clamp(1rem,1.5vw,1.3rem); font-weight:900; color:var(--gold); text-align:right; white-space:nowrap; }
.tv-qual-note{ margin:18px 0 0; font-size:clamp(.9rem,1.2vw,1.1rem); font-weight:600; opacity:.72; }

/* ---- Qualifiers pair (two lists side by side, e.g. Regional Champions + Fargo Qualifiers) ---- */
.tv-qual-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  width:100%;
  align-items:start;
  margin-top:14px;
}
.tv-qual-pair-title{
  font-size:clamp(1.3rem,2.1vw,1.75rem);
  font-weight:900;
  margin:0 0 14px;
  color:var(--gold);
}
.tv-qual-list.single{ column-count:1; max-width:none; margin:0; }
.tv-qual-list.single .tv-qual-row{ margin-bottom:8px; }

/* ---- Team accomplishments (from State Board) ---- */
.tv-team-accom{
  display:grid;
  gap:48px;
  max-width:1400px;
  margin:0 auto;
}
.tv-team-group-label{
  font-size:clamp(1.6rem,2.7vw,2.3rem);
  font-weight:900;
  letter-spacing:-.01em;
  margin:0 0 16px;
}
.tv-team-years{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
}
.tv-team-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:clamp(1.5rem,2.4vw,2.1rem);
  font-weight:900;
  color:var(--gold);
  background:rgba(232,195,122,.14);
  border:1px solid rgba(232,195,122,.45);
  border-radius:999px;
  padding:12px 28px;
}
.tv-team-note{ margin:26px 0 0; font-size:clamp(1.05rem,1.5vw,1.35rem); font-weight:600; opacity:.72; }


/* Team Accomplishments slide: larger text (lots of room) */
.team-slide .tv-lb-eyebrow{ font-size:clamp(1.8rem,3vw,2.8rem); margin-bottom:14px; }
.team-slide .tv-lb-title{ font-size:clamp(3.4rem,7vw,6.5rem); margin-bottom:40px; }
.team-slide .tv-team-accom{ gap:70px; max-width:1700px; }
.team-slide .tv-team-group-label{ font-size:clamp(2.6rem,4.8vw,4.4rem); margin-bottom:26px; }
.team-slide .tv-team-years{ gap:28px; }
.team-slide .tv-team-chip{ font-size:clamp(2.6rem,4.8vw,4.4rem); padding:18px 54px; }
.team-slide .tv-team-note{ font-size:clamp(1.6rem,2.7vw,2.4rem); margin-top:44px; }

/* Fullscreen helper button */
#tv-fs-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:70;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-weight:800;
  font-size:1.05rem;
  border-radius:999px;
  padding:10px 18px;
  cursor:pointer;
  opacity:.55;
}
#tv-fs-btn:hover{ opacity:1; }
body.is-fullscreen #tv-fs-btn{ display:none; }

/* QR code, bottom-right */
#tv-qr-box{
  position:fixed;
  bottom:24px;
  right:32px;
  z-index:50;
  display:flex;
  flex-direction:column-reverse;
  align-items:center;
  gap:6px;
  width:150px;
  opacity:.92;
}
#tv-qr-box img{
  width:150px;
  height:150px;
  border-radius:14px;
  background:#fff;
  padding:8px;
  display:block;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
#tv-qr-box span{
  width:100%;
  text-align:center;
  white-space:nowrap;
  font-size:1.3rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

@media(max-width:1100px){
  .tv-lb-pair{ grid-template-columns:1fr; gap:20px; }
  .tv-lb-grid{ grid-template-columns:1fr 1fr; gap:16px; }
  .tv-pillar-grid{ grid-template-columns:1fr 1fr; }
  .tv-qual-list{ column-count:1; }
  .tv-pins-list{ column-count:1; }
  .tv-qual-pair{ grid-template-columns:1fr; gap:24px; }
}
@media(max-width:700px){
  .tv-logo img{ height:56px; }
  .tv-logo-title{ font-size:1.15rem; }
  .tv-logo-sub{ font-size:.72rem; }
  .tv-pillar-grid{ grid-template-columns:1fr; }
  .tv-lb-grid{ grid-template-columns:1fr; }
  #tv-qr-box{ bottom:14px; right:14px; gap:0; }
  #tv-qr-box img{ width:46px; height:46px; }
  #tv-qr-box span{ display:none; }
}
/* ---- Corner countdown (every slide) ---- */
#tv-countdown{ position:fixed; top:24px; right:32px; z-index:50; text-align:center; opacity:.95; }
#tv-countdown, #tv-countdown *, #tv-qr-box, #tv-qr-box *, .tv-logo, .tv-logo *{ cursor:none !important; }
#tv-countdown .cd-label{ font-size:.85rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; text-shadow:0 2px 8px rgba(0,0,0,.6); }
#tv-countdown .cd-row{ display:flex; gap:8px; }
#tv-countdown .cd-box{ min-width:62px; padding:8px 6px 6px; background:rgba(255,255,255,.1); border:1px solid rgba(232,195,122,.5); border-radius:12px; }
#tv-countdown .cd-num{ font-size:1.6rem; font-weight:900; line-height:1; color:#fff; font-variant-numeric:tabular-nums; }
#tv-countdown .cd-unit{ font-size:.62rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.8; margin-top:3px; }
@media(max-width:1100px){ #tv-countdown{ top:10px; right:10px; transform:scale(.7); transform-origin:top right; } }
</style>
<style>#tv-luck{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:41; background:#e8c37a; color:#2a0f16; padding:12px 34px; border-radius:999px; font-size:clamp(1.1rem,2vw,1.9rem); font-weight:800; text-align:center; box-shadow:0 12px 30px rgba(0,0,0,.3); white-space:nowrap; } #tv-luck b{ text-transform:uppercase; letter-spacing:.06em; }</style>
<style>
/* Volleyball good-luck takeover */
.tv-vb{ position:absolute !important; inset:0; width:100% !important; height:100% !important; max-height:none !important; margin:0 !important; padding:0 !important; background:radial-gradient(circle at 50% 45%, #a01a3c 0%, #7a1230 45%, #4a0a1c 100%); overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:0; }
html.vb-on #tv-countdown{ display:none !important; }
html.vb-on body .tv-logo img{ filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)) !important; }
.tv-vb::after{ content:''; position:absolute; inset:14px; border:6px solid #fff; border-radius:22px; z-index:4; pointer-events:none; }
.tv-vb-rays{ position:absolute; left:50%; top:50%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.14) 0deg 10deg, rgba(255,255,255,0) 10deg 20deg); animation:vbSpin 70s linear infinite; z-index:0; }
.tv-vb-glow{ position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.18), rgba(0,0,0,0) 60%); animation:vbPulse 5s ease-in-out infinite; z-index:0; }

let current = 0;
let showingA = true;

function runProgressBar(duration){
  const bar = document.getElementById('tv-progress-bar');
  bar.classList.remove('animate');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.classList.add('animate');
  bar.style.transition = `width ${duration}ms linear`;
  bar.style.width = '100%';
}

// Shrink a slide's content to fit the screen (handles fullscreen / TV size differences)
function fitSlide(layer){
  const el = layer && layer.querySelector('.slide-inner');
  if(!el || el.classList.contains('tv-vb')) return;
  el.style.transform = '';
  el.style.maxHeight = 'none';
  const availH = window.innerHeight * 0.94, availW = window.innerWidth * 0.97;
  const h = el.scrollHeight, w = Math.max(el.scrollWidth, el.offsetWidth);
  const s = Math.min(1, availH / h, availW / w);
  if(s < 1){ el.style.transform = 'scale(' + s.toFixed(3) + ')'; el.style.transformOrigin = 'center center'; }
}
function fitAll(){ ['layerA','layerB'].forEach(id => fitSlide(document.getElementById(id))); }
window.addEventListener('resize', fitAll);
document.addEventListener('fullscreenchange', () => setTimeout(fitAll, 150));

function showSlide(index){
  const slide = SLIDES[index];
  const layerA = document.getElementById('layerA');
  const layerB = document.getElementById('layerB');
  const incoming = showingA ? layerB : layerA;
  const outgoing = showingA ? layerA : layerB;

  incoming.innerHTML = renderSlide(slide);
  fitSlide(incoming);
  incoming.classList.add('active');
  outgoing.classList.remove('active');
  showingA = !showingA;

  runProgressBar(slide.duration);

  clearTimeout(window.__tvTimer);
  window.__tvTimer = setTimeout(() => {
    current = (current + 1) % SLIDES.length;
    showSlide(current);
  }, slide.duration);
}

document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
});


// Click / tap anywhere (or remote Select) to jump to the next slide
document.addEventListener('click', function(){ goToSlide(current + 1); });

// Anti burn-in: slowly drift the static logo + QR code a few pixels every couple of minutes
(function(){
  var els = [document.querySelector('.tv-logo'), document.getElementById('tv-qr-box'), document.getElementById('tv-countdown')];
  els.forEach(function(e){ if(e) e.style.transition = 'transform 4s ease-in-out'; });
  function shift(){
    var x = Math.round((Math.random()*2-1)*14), y = Math.round((Math.random()*2-1)*14);
    els.forEach(function(e){ if(e) e.style.transform = 'translate(' + x + 'px,' + y + 'px)'; });
  }
  shift();
  setInterval(shift, 2 * 60 * 1000);
})();

(function(){
  var lock=null;
  function getLock(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(l){ lock=l; l.addEventListener('release',function(){ lock=null; }); }).catch(function(){});
  }
  getLock();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && !lock) getLock(); });
  document.addEventListener('click', function(){ if(!lock) getLock(); playKeepAwake(); });
  var vid=null;
  function playKeepAwake(){ if(vid){ var p=vid.play(); if(p&&p.catch) p.catch(function(){}); } }
  try{
    var cv=document.createElement('canvas'); cv.width=16; cv.height=16;
    var ctx=cv.getContext('2d'), n=0;
    setInterval(function(){ n=(n+1)%2; ctx.fillStyle=n?'#010101':'#000'; ctx.fillRect(0,0,16,16); }, 1000);
    if(cv.captureStream){
      vid=document.createElement('video');
      vid.muted=true; vid.loop=true; vid.playsInline=true; vid.setAttribute('muted',''); vid.setAttribute('playsinline','');
      vid.srcObject=cv.captureStream(1);
      vid.style.cssText='position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.02;pointer-events:none;z-index:-1;';
      document.body.appendChild(vid);
      playKeepAwake();
    }
  }catch(e){}
})();


// Season countdown (top-right corner). Change data-start on #tv-countdown to move the date; it hides itself once the season starts.
function tickCountdown(){
  var w=document.getElementById('tv-countdown'); if(!w) return;
  var diff=new Date(w.getAttribute('data-start'))-new Date();
  if(diff<=0){ w.style.display='none'; return; }
  var sec=Math.floor(diff/1000), v={d:Math.floor(sec/86400),h:Math.floor(sec%86400/3600),m:Math.floor(sec%3600/60),s:sec%60};
  for(var u in v){ var el=w.querySelector('[data-u="'+u+'"]'); if(el) el.textContent=(u==='d')?v[u]:String(v[u]).padStart(2,'0'); }
}
setInterval(tickCountdown,1000); tickCountdown();

// Keep the mouse pointer hidden everywhere (re-applied on every mouse move)
(function(){
  var st=document.createElement('style'); st.textContent='html,body,body *,#stage,#stage *{cursor:none !important}'; document.head.appendChild(st);
  function hide(){
    document.documentElement.style.setProperty('cursor','none','important'); document.body.style.setProperty('cursor','none','important');
    var all=document.querySelectorAll('*'); for(var i=0;i<all.length;i++) all[i].style.setProperty('cursor','none','important');
  }
  hide(); ['mousemove','mouseover','mousedown','pointermove'].forEach(function(e){ document.addEventListener(e, function(ev){ if(ev.target&&ev.target.style) ev.target.style.setProperty('cursor','none','important'); document.documentElement.style.setProperty('cursor','none','important'); }, true); });
  setInterval(hide, 5000);
})();
function goToSlide(index){
  current = (index + SLIDES.length) % SLIDES.length;
  showSlide(current);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); } else { document.exitFullscreen().catch(() => {}); }
  } else if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    goToSlide(current + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goToSlide(current - 1);
  }
});
