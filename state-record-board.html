<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holmen Women's Wrestling — State Place Winners &amp; Qualifiers</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#6d1730">
<style>
:root{
  --maroon:#6d1730;
  --dark:#3f0b1a;
  --light:#f5f5f7;
  --ink:#19191d;
  --gold:#e8c37a;
  --silver:#d7dde3;
  --bronze:#d79a6a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;
}

#stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.slide-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:1;
  transition:opacity 1.3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#000 0%,var(--dark) 35%,var(--maroon) 65%,#000 100%);
}
.slide-layer.active{ opacity:1; z-index:2; }

.slide-inner{
  position:relative;
  z-index:2;
  width:min(1900px,97vw);
  max-height:95vh;
  margin:auto;
  text-align:center;
  padding:24px;
}

/* Logo watermark, persistent corner */
.tv-logo{
  position:fixed;
  top:28px;
  left:32px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:14px;
  opacity:.92;
  pointer-events:none;
}
.tv-logo img{ height:104px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.tv-logo-text{ display:flex; flex-direction:column; gap:2px; }
.tv-logo-title{
  font-weight:900;
  font-size:2.3rem;
  letter-spacing:-.02em;
  line-height:1.1;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.tv-logo-sub{
  font-weight:700;
  font-size:1.7rem;
  letter-spacing:-.01em;
  opacity:.85;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* Progress bar */
#tv-progress-wrap{
  position:fixed;
  left:0; right:0; bottom:0;
  height:6px;
  background:rgba(255,255,255,.14);
  z-index:60;
}
#tv-progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),#fff);
}
#tv-progress-bar.animate{ transition:width linear; }

/* ---- Slide type: title (section divider) ---- */
.tv-eyebrow{
  text-transform:uppercase;
  letter-spacing:.24em;
  font-size:clamp(2rem,3.6vw,3.4rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 18px;
}
.tv-title-heading{
  font-size:clamp(3.2rem,7.6vw,7.2rem);
  font-weight:900;
  letter-spacing:-.03em;
  margin:0 0 20px;
  line-height:1.05;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}
.tv-title-sub{
  font-size:clamp(1.4rem,2.7vw,2.3rem);
  font-weight:600;
  max-width:1000px;
  margin:0 auto;
  line-height:1.5;
  opacity:.96;
}

/* ---- Eyebrow + title above lists ---- */
.tv-lb-eyebrow{
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:clamp(1.3rem,2.2vw,1.9rem);
  font-weight:900;
  color:var(--gold);
  margin:0 0 10px;
}
.tv-lb-title{
  font-size:clamp(2.4rem,5vw,4.6rem);
  font-weight:900;
  letter-spacing:-.02em;
  margin:0 0 26px;
}

/* ---- Qualifiers / Champions list ---- */
.tv-qual-list{
  display:grid;
  gap:12px;
  max-width:1300px;
  margin:0 auto;
  text-align:left;
}
.tv-qual-row{
  display:grid;
  grid-template-columns:110px minmax(0,1fr) 110px auto;
  align-items:center;
  gap:20px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  padding:13px 24px;
}
.tv-qual-row.champ{ background:rgba(232,195,122,.13); border-color:rgba(232,195,122,.4); grid-template-columns:110px minmax(0,1fr) 110px; }
.tv-qual-year{ font-size:clamp(1.3rem,2.1vw,1.75rem); font-weight:900; opacity:.8; }
.tv-qual-name{ font-size:clamp(1.35rem,2.15vw,1.85rem); font-weight:800; letter-spacing:-.01em; }
.tv-qual-weight{ font-size:clamp(1.1rem,1.7vw,1.45rem); font-weight:700; opacity:.75; text-align:center; }
.tv-qual-result{ font-size:clamp(1.3rem,2.1vw,1.75rem); font-weight:900; color:var(--gold); text-align:right; white-space:nowrap; }
.tv-qual-note{ margin:22px 0 0; font-size:clamp(1rem,1.4vw,1.25rem); font-weight:600; opacity:.72; }

/* ---- Team accomplishments ---- */
.tv-team-accom{
  display:grid;
  gap:48px;
  max-width:1400px;
  margin:0 auto;
}
.tv-team-group-label{
  font-size:clamp(1.9rem,3.2vw,2.8rem);
  font-weight:900;
  letter-spacing:-.01em;
  margin:0 0 20px;
}
.tv-team-years{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
}
.tv-team-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:clamp(1.8rem,2.9vw,2.5rem);
  font-weight:900;
  color:var(--gold);
  background:rgba(232,195,122,.14);
  border:1px solid rgba(232,195,122,.45);
  border-radius:999px;
  padding:16px 36px;
}
.tv-team-note{ margin:26px 0 0; font-size:clamp(1.05rem,1.5vw,1.35rem); font-weight:600; opacity:.72; }

/* Fullscreen helper button */
#tv-fs-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:70;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-weight:800;
  font-size:1.05rem;
  border-radius:999px;
  padding:10px 18px;
  cursor:pointer;
  opacity:.55;
}
#tv-fs-btn:hover{ opacity:1; }
body.is-fullscreen #tv-fs-btn{ display:none; }

/* QR code, persistent corner */
#tv-qr-box{
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  opacity:.92;
}
#tv-qr-box img{
  width:100px;
  height:100px;
  border-radius:10px;
  background:#fff;
  padding:6px;
  display:block;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
#tv-qr-box span{
  font-size:.9rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

@media(max-width:1100px){
  .tv-qual-row{ grid-template-columns:80px minmax(0,1fr) 90px auto; gap:12px; padding:11px 16px; }
}
@media(max-width:700px){
  .tv-logo img{ height:56px; }
  .tv-logo-title{ font-size:1.15rem; }
  .tv-logo-sub{ font-size:.9rem; }
  #tv-qr-box img{ width:70px; height:70px; }
  #tv-qr-box span{ font-size:.6rem; }
}
</style>
</head>
<body>

<div class="tv-logo"><img src="assets/images/logo.png" alt=""><div class="tv-logo-text"><span class="tv-logo-title">State Board</span><span class="tv-logo-sub">Holmen Women's Wrestling</span></div></div>

<div id="stage">
  <div class="slide-layer active" id="layerA"></div>
  <div class="slide-layer" id="layerB"></div>
</div>

<div id="tv-progress-wrap"><div id="tv-progress-bar"></div></div>
<button id="tv-fs-btn" type="button">⛶ Fullscreen</button>
<div id="tv-qr-box"><img id="tv-qr-img" alt="QR code linking to full stats and records"><span>Full Stats</span></div>

<script>
// ---- Data (from results.html — State Tournament Qualifiers & Placewinners, Regional Champions, Sectional Champions) ----

const STATE_QUALIFIERS_A = [
  {year:'2026',name:'Aini Anderson',weight:'100',result:'2nd'},
  {year:'2026',name:'Kaytlynn Lambries',weight:'126',result:'2x Qualifier'},
  {year:'2026',name:'Avalee Euler',weight:'185',result:'Qualifier'},
  {year:'2025',name:'Haley Dezelske',weight:'114',result:'Qualifier'},
  {year:'2025',name:'Allison Weiss',weight:'120',result:'2x Qualifier'},
  {year:'2024',name:'Aini Anderson',weight:'100',result:'Qualifier'},
  {year:'2024',name:'Kaytlynn Lambries',weight:'107',result:'6th'},
  {year:'2024',name:'Allison Weiss',weight:'114',result:'Qualifier'},
  {year:'2024',name:'Anna Strasser',weight:'126',result:'Qualifier'}
];

const STATE_QUALIFIERS_B = [
  {year:'2024',name:'Alexa Szak',weight:'145',result:'2x Qualifier'},
  {year:'2024',name:'Maddie Hall',weight:'165',result:'Qualifier'},
  {year:'2024',name:'Sophia Walter',weight:'185',result:'Qualifier'},
  {year:'2023',name:'Nora Lee',weight:'100',result:'5th'},
  {year:'2023',name:'Evelyn Vetsch',weight:'145',result:'3rd'},
  {year:'2023',name:'Alexa Szak',weight:'152',result:'Qualifier'},
  {year:'2023',name:'Maddie Hall',weight:'165',result:'Qualifier'},
  {year:'2022',name:'Evelyn Vetsch',weight:'152',result:'4th'},
  {year:'2022',name:'Emily Szak',weight:'165',result:'5th'}
];

const REGIONAL_CHAMPIONS = [
  {year:'2026',name:'Aini Anderson',weight:'100',result:'Champion'},
  {year:'2026',name:'Peyton Kratochvill',weight:'114',result:'Champion'},
  {year:'2026',name:'Kaytlynn Lambries',weight:'126',result:'Champion'},
  {year:'2026',name:'Avalee Euler',weight:'185',result:'Champion'},
  {year:'2025',name:'Kaytlynn Lambries',weight:'107',result:'Champion'},
  {year:'2025',name:'Haley Dezelske',weight:'114',result:'Champion'},
  {year:'2025',name:'Allison Weiss',weight:'120',result:'Champion'},
  {year:'2025',name:'Alexa Szak',weight:'138',result:'Champion'},
  {year:'2025',name:'Avalee Euler',weight:'165',result:'Champion'}
];

const SECTIONAL_CHAMPIONS_RECENT = [
  {year:'2026',name:'Aini Anderson',weight:'100',result:'Champion'},
  {year:'2026',name:'Kaytlynn Lambries',weight:'126',result:'Champion'},
  {year:'2025',name:'Haley Dezelske',weight:'114',result:'Champion'},
  {year:'2024',name:'Aini Anderson',weight:'100',result:'Champion'},
  {year:'2024',name:'Kaytlynn Lambries',weight:'107',result:'Champion'},
  {year:'2024',name:'Allison Weiss',weight:'114',result:'Champion'}
];

const SECTIONAL_CHAMPIONS_EARLY = [
  {year:'2024',name:'Anna Strasser',weight:'126',result:'Champion'},
  {year:'2024',name:'Alexa Szak',weight:'145',result:'Champion'},
  {year:'2024',name:'Maddie Hall',weight:'165',result:'Champion'},
  {year:'2023',name:'Evelyn Vetsch',weight:'145',result:'Champion'},
  {year:'2023',name:'Alexa Szak',weight:'152',result:'Champion'},
  {year:'2023',name:'Maddie Hall',weight:'165',result:'Champion'}
];

const TEAM_ACCOMPLISHMENTS = [
  { label:'Team Regional Champions', years:['2024–25','2025–26'] },
  { label:'Team Sectional Champions', years:['2024–25','2025–26'] }
];

// ---- Build slide list ----
const SLIDES = [];

SLIDES.push({ type:'team-accomplishments', duration:8500, eyebrow:'Postseason Herstory', title:'Team Accomplishments', groups:TEAM_ACCOMPLISHMENTS, note:'Girls team regionals and sectionals began in 2024–25.' });

SLIDES.push({ type:'qual-list', duration:9000, eyebrow:'Postseason Herstory', title:'State Qualifiers & Placewinners', rows:STATE_QUALIFIERS_A });
SLIDES.push({ type:'qual-list', duration:9000, eyebrow:'Postseason Herstory', title:'State Qualifiers & Placewinners', rows:STATE_QUALIFIERS_B, note:'Girls state wrestling began in 2022.' });

SLIDES.push({ type:'qual-list', duration:9000, eyebrow:'Postseason Herstory', title:'Regional Champions', rows:REGIONAL_CHAMPIONS, note:'Girls regionals began in 2025.', champ:true });

SLIDES.push({ type:'qual-list', duration:9000, eyebrow:'Postseason Herstory', title:'Sectional Champions', rows:SECTIONAL_CHAMPIONS_RECENT, champ:true });
SLIDES.push({ type:'qual-list', duration:8500, eyebrow:'Postseason Herstory', title:'Sectional Champions', rows:SECTIONAL_CHAMPIONS_EARLY, note:'Girls sectionals began in 2023.', champ:true });

// ---- Rendering ----
function qualRowsHtml(rows, champ){
  return rows.map(r => `
    <div class="tv-qual-row ${champ?'champ':''}">
      <div class="tv-qual-year">${r.year}</div>
      <div class="tv-qual-name">${r.name}</div>
      <div class="tv-qual-weight">${r.weight}</div>
      ${champ ? '' : `<div class="tv-qual-result">${r.result}</div>`}
    </div>`).join('');
}

function renderSlide(slide){
  switch(slide.type){
    case 'title':
      return `<div class="slide-inner">
        <div class="tv-eyebrow">${slide.eyebrow}</div>
        <h1 class="tv-title-heading">${slide.title}</h1>
        <p class="tv-title-sub">${slide.sub}</p>
      </div>`;

    case 'qual-list':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.eyebrow}</div>
        <h2 class="tv-lb-title">${slide.title}</h2>
        <div class="tv-qual-list">${qualRowsHtml(slide.rows, slide.champ)}</div>
        ${slide.note ? `<p class="tv-qual-note">${slide.note}</p>` : ''}
      </div>`;

    case 'team-accomplishments':
      return `<div class="slide-inner">
        <div class="tv-lb-eyebrow">${slide.eyebrow}</div>
        <h2 class="tv-lb-title">${slide.title}</h2>
        <div class="tv-team-accom">
          ${slide.groups.map(g => `
            <div class="tv-team-group">
              <div class="tv-team-group-label">${g.label}</div>
              <div class="tv-team-years">${g.years.map(y => `<span class="tv-team-chip">${y}</span>`).join('')}</div>
            </div>`).join('')}
        </div>
        ${slide.note ? `<p class="tv-team-note">${slide.note}</p>` : ''}
      </div>`;

    default:
      return '';
  }
}

let current = 0;
let showingA = true;

function runProgressBar(duration){
  const bar = document.getElementById('tv-progress-bar');
  bar.classList.remove('animate');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.classList.add('animate');
  bar.style.transition = `width ${duration}ms linear`;
  bar.style.width = '100%';
}

function showSlide(index){
  const slide = SLIDES[index];
  const layerA = document.getElementById('layerA');
  const layerB = document.getElementById('layerB');
  const incoming = showingA ? layerB : layerA;
  const outgoing = showingA ? layerA : layerB;

  incoming.innerHTML = renderSlide(slide);
  incoming.classList.add('active');
  outgoing.classList.remove('active');
  showingA = !showingA;

  runProgressBar(slide.duration);

  clearTimeout(window.__tvTimer);
  window.__tvTimer = setTimeout(() => {
    current = (current + 1) % SLIDES.length;
    showSlide(current);
  }, slide.duration);
}

document.getElementById('tv-fs-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
});

function goToSlide(index){
  current = (index + SLIDES.length) % SLIDES.length;
  showSlide(current);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    document.getElementById('tv-fs-btn').click();
  } else if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    goToSlide(current + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goToSlide(current - 1);
  }
});

const qrImg = document.getElementById('tv-qr-img');
if (qrImg) {
  const statsUrl = location.origin + '/results.html#allpostseason';
  qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=' + encodeURIComponent(statsUrl);
}

showSlide(current);
</script>
</body>
</html>
